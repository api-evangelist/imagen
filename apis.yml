name: Imagen
description: >-
  Imagen (Imagen Technologies) is an AI-enabled, sub-specialized diagnostic
  imaging partner for independent practices, hospitals, and health systems. It
  combines in-clinic imaging equipment, FDA-cleared AI algorithms, and a 24/7
  teleradiology network of fellowship-trained, board-certified specialists to
  deliver rapid, accurate radiology interpretations, plus advanced analytics for
  care-gap identification. Imagen operates across 23 states, serving roughly 3.5
  million patients, and is backed by GV and Threshold Ventures. The company
  publishes a security program covering SOC 2 Type II, the HITRUST CSF, and
  HIPAA. Imagen Technologies exposes no public developer API surface at this
  time. (Note the distinct namesake company Imagen AI, imagen-ai.com, an AI
  photo-editing product that does publish an API and SDK.)
